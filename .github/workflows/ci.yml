# The CI job `ci` (§20 part 4): the same checks as `pnpm check`, plus secrets, advisories, workflow lint and licences.
# Every action is pinned to a commit SHA; every downloaded tool is checked against a pinned SHA-256.
#
# No repository secrets here, ever: this job runs on pull_request, where the branch's code is untrusted. Jobs that need
# secrets (the AI evals, §17) live in their own workflow and run only on push to main or workflow_dispatch (§20 part 6).
# The one credential used is GitHub's automatic read-only token, for zizmor's online audits, before any PR code runs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  ZIZMOR_VERSION: 1.32.0
  ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans every commit

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install tools (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C bin gitleaks
          curl -fsSLo bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  bin/osv-scanner" | sha256sum -c -
          chmod +x bin/osv-scanner
          curl -fsSLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz -C bin zizmor
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Reads the workflow files only, before any of the branch's code is installed or run.
      - name: Workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }} # read-only; lets zizmor run its online audits (impostor commits, known-vulnerable actions)
        run: zizmor --config .github/zizmor.yml --format plain .github/workflows

      - name: Install dependencies (frozen lockfile)
        id: install
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      # Each check below runs even when an earlier one failed, so one run shows every problem.
      - name: pnpm check (typecheck, lint, format, unit tests, licences)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check

      - name: Secrets (gitleaks, every commit)
        if: ${{ !cancelled() }}
        run: gitleaks git --redact --no-banner --verbose .

      - name: Advisories (pnpm audit, high and above)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --audit-level high

      - name: Advisories (OSV-Scanner on the lockfile)
        if: ${{ !cancelled() }}
        run: osv-scanner scan source --lockfile pnpm-lock.yaml
