# The CI job `ci` (§20 part 4): the same checks as `pnpm check`, plus secrets, advisories, workflow lint and licences.
# Every action is pinned to a commit SHA; every downloaded tool is checked against a pinned SHA-256.
#
# No repository secrets here, ever: this job runs on pull_request, where the branch's code is untrusted. Jobs that need
# secrets (the AI evals, §17) live in their own workflow and run only on push to main or workflow_dispatch (§20 part 6).
# The one credential used is GitHub's automatic read-only token, for zizmor's online audits, before any PR code runs.
#
# Order: the scanners that only read files (zizmor, gitleaks, OSV-Scanner, pnpm audit on the lockfile) run first, before
# `pnpm install` or any of the branch's code, so that code can't tamper with the tools or their results.
name: ci

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # runs on main are never cancelled

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  ZIZMOR_VERSION: 1.32.0
  ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
  # The fallback's zizmor: the PyPI wheel for the same version (zizmor-1.32.0-py3-none-manylinux_2_28_x86_64.whl), its
  # SHA-256 as PyPI's JSON API lists it, and the same hash computed on a downloaded copy.
  ZIZMOR_WHEEL_SHA256: 84a6acb975accc13408786a2bd274b572537ca19c933ebbc13e78f3988562071

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # 10 for the checks; room for the scanners' fallback builds (#101)
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the head's whole history

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Each tool comes from its GitHub release, checked against its pinned SHA-256; a mismatch fails the job. Only when
      # the download itself fails (GitHub's release-file service was down for hours on 2026-11-08, #101) does the same
      # pinned version come from a source with its own integrity check: gitleaks and OSV-Scanner built from the Go
      # module proxy, every module checked against sum.golang.org; zizmor from PyPI with the wheel's pinned SHA-256.
      # Each attempt is capped (15 s to connect, 60 s in all, 2 retries), and once one release download fails the other
      # tools go straight to the fallback, so a hanging release service can't use up the job's time.
      # LZP_TOOLS_FALLBACK_ONLY=1 skips the release downloads, to show the fallback works.
      - name: Install tools (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          releases_down="${LZP_TOOLS_FALLBACK_ONLY:-}"
          release() {
            if [ "$releases_down" != 1 ] &&
              curl -fsSL --connect-timeout 15 --max-time 60 --retry 2 --retry-all-errors -o "$1" "$2"; then
              echo "::notice::$(basename "$2"): from the GitHub release, SHA-256 checked below"
              return 0
            fi
            releases_down=1
            return 1
          }
          gobuild() {
            echo "::warning::$1: the GitHub release is unavailable; building it from the Go module proxy"
            GOBIN="$RUNNER_TEMP/bin" GOFLAGS=-trimpath GOTOOLCHAIN=auto GOPROXY=https://proxy.golang.org \
              GOSUMDB=sum.golang.org go install "$1"
            go version -m "$RUNNER_TEMP/bin/$2" | grep -E '^\s+mod\s' # the module, version and sum.golang.org hash built
          }
          if release gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"; then
            echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
            tar -xzf gitleaks.tar.gz -C bin gitleaks
          else
            gobuild "github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}" gitleaks
          fi
          if release bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"; then
            echo "${OSV_SCANNER_SHA256}  bin/osv-scanner" | sha256sum -c -
            chmod +x bin/osv-scanner
          else
            rm -f bin/osv-scanner
            gobuild "github.com/google/osv-scanner/v2/cmd/osv-scanner@v${OSV_SCANNER_VERSION}" osv-scanner
          fi
          if release zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"; then
            echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
            tar -xzf zizmor.tar.gz -C bin zizmor
          else
            echo "::warning::zizmor: the GitHub release is unavailable; installing the same version from PyPI"
            echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_WHEEL_SHA256}" > zizmor-req.txt
            python3 -m pip install --disable-pip-version-check --no-deps --only-binary :all: --require-hashes \
              --target "$RUNNER_TEMP/zizmor-py" -r zizmor-req.txt
            cp "$RUNNER_TEMP/zizmor-py/bin/zizmor" bin/zizmor
          fi
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          bin/gitleaks version && bin/osv-scanner --version | sed -n 1p && bin/zizmor --version

      # Before any of the branch's code is installed or run. Each check runs even when an earlier one failed, so one
      # run shows every problem.
      - name: Workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }} # read-only; lets zizmor run its online audits (impostor commits, known-vulnerable actions)
        run: zizmor --config .github/zizmor.yml --format plain .github/workflows

      - name: Secrets (gitleaks, the head's history)
        if: ${{ !cancelled() }}
        run: gitleaks git --log-opts=HEAD --redact --no-banner --verbose .

      - name: Advisories (OSV-Scanner on the lockfile)
        if: ${{ !cancelled() }}
        run: osv-scanner scan source --lockfile pnpm-lock.yaml

      - name: Advisories (pnpm audit on the lockfile, high and above)
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level high

      - name: Install dependencies (frozen lockfile)
        id: install
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      # On its own and first, so neither a failing test nor the branch's test code can hide a licence problem.
      - name: Licences (every workspace package)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm licence-check

      - name: pnpm check (typecheck, lint, format, unit tests, licences)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check
