<title>LetZeusPost App Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;600&family=Anton&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: a calm pro tool. Neutral stone surfaces, one gold accent used as a fill; clients' posts carry the color. */
:root {
  --bg: #F7F6F4; --surface: #FFFFFF; --surface-2: #F1F0EC; --border: #E4E2DD; --border-strong: #D3D0C9; --input: #8A857D;
  --ink: #1C1A17; --muted: #5B5750; --faint: #6F6A62;
  --gold: #F5B301; --on-gold: #1C1A17; --accent-text: #8A5D00; --focus: #1C1A17;
  --st-gen: #5C6B7E; --st-fix: #C2261F; --st-review: #8A5D00; --st-client: #6D3FD1; --st-ok: #13773D; --st-done: #6F6A62;
  --qc-pass: #13773D; --qc-warn: #A15C00; --qc-fail: #C2261F;
  --shadow: 0 1px 2px rgba(28,26,23,.06), 0 8px 24px rgba(28,26,23,.08);
  --ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-ctl: 8px; --r-card: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11100E; --surface: #191815; --surface-2: #22201C; --border: #2F2C27; --border-strong: #3E3A33; --input: #706B63;
  --ink: #F3F1EC; --muted: #B3AEA4; --faint: #8C877E;
  --gold: #F5B301; --on-gold: #1C1A17; --accent-text: #F5B301; --focus: #F5B301;
  --st-gen: #94A3B8; --st-fix: #F87171; --st-review: #F5B301; --st-client: #B39DFA; --st-ok: #4ADE80; --st-done: #A8A29E;
  --qc-pass: #4ADE80; --qc-warn: #FBBF24; --qc-fail: #F87171;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11100E; --surface: #191815; --surface-2: #22201C; --border: #2F2C27; --border-strong: #3E3A33; --input: #706B63;
  --ink: #F3F1EC; --muted: #B3AEA4; --faint: #8C877E;
  --gold: #F5B301; --on-gold: #1C1A17; --accent-text: #F5B301; --focus: #F5B301;
  --st-gen: #94A3B8; --st-fix: #F87171; --st-review: #F5B301; --st-client: #B39DFA; --st-ok: #4ADE80; --st-done: #A8A29E;
  --qc-pass: #4ADE80; --qc-warn: #FBBF24; --qc-fail: #F87171;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui); padding-block: 12px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 22px; font-weight: 650; } h2 { font-size: 16px; font-weight: 650; } h3 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex: none; }

/* mockup bar */
.mockbar { max-width: 1440px; margin: 0 auto 10px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13px; }
.mockbar .left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mocktag { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.mockbar select { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-ctl); padding: 5px 8px; max-width: 100%; }

/* app frame */
.app { max-width: 1440px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 760px; overflow: hidden; }
.side { border-right: 1px solid var(--border); background: var(--surface-2); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; padding: 4px 8px 14px; letter-spacing: -.01em; }
.logo .wm { font-weight: 500; letter-spacing: -.02em; } .logo .wm b { font-weight: 700; }
.brandlogo svg { width: 1.3em; height: 1.3em; flex: none; }
.logo-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; gap: 12px; padding: 14px; align-items: center; }
.logo-bg { border-radius: 10px; padding: 18px 20px; border: 1px solid var(--border); }
.logo-bg.light { background: #FFFFFF; } .logo-bg.dark { background: #11100E; }
.logo-bg svg { width: 100%; max-width: 300px; height: auto; display: block; }
.logo-sizes { display: flex; gap: 10px; align-items: flex-end; }
@media (max-width: 900px) { .logo-row { grid-template-columns: minmax(0,1fr); } }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-ctl); color: var(--muted); text-decoration: none; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; font-weight: 500; }
.nav:hover { background: var(--surface); color: var(--ink); }
.nav[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 2px 0 0 var(--ink); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.side .group { margin-top: 14px; }
.dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.usage { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
:root[data-theme="dark"] .bar > i { background: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar > i { background: var(--gold); } }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.ws { font-weight: 600; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.ws-btn { border: 0; background: none; font: inherit; font-weight: 600; color: inherit; padding: 6px 8px; margin-left: -8px; border-radius: 8px; cursor: pointer; }
.ws-btn:hover { background: var(--surface-2); }
.ws-btn svg.lucide { width: 15px; height: 15px; color: var(--muted); }
.admin-note { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 9px 12px; border-radius: 9px; background: var(--surface-2); margin-bottom: 16px; }
.admin-note svg.lucide { width: 16px; height: 16px; }
.table-wrap { overflow-x: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
table.t tr.cur td { background: var(--surface-2); }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface-2); border-radius: var(--r-ctl); padding: 6px 10px; color: var(--faint); min-width: 0; width: 260px; max-width: 100%; }
.kbd { margin-left: auto; font-size: 11px; border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border); flex: none; }
.view { padding: 20px 22px 28px; min-width: 0; flex: 1; }

/* buttons, chips, badges */
.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-ctl); padding: 7px 12px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn-gold { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn-gold:hover { background: #E0A400; border-color: #E0A400; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { padding: 4px 9px; font-size: 13px; }
.icon-btn { border: 1px solid transparent; background: none; border-radius: var(--r-ctl); padding: 6px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; background: var(--surface); cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 550; padding: 2px 8px 2px 6px; border-radius: 6px; border: 1px solid currentColor; white-space: nowrap; background: var(--surface); }
.badge svg.lucide { width: 13px; height: 13px; }
.st-gen { color: var(--st-gen); } .st-fix { color: var(--st-fix); } .st-review { color: var(--st-review); }
.st-client { color: var(--st-client); } .st-ok { color: var(--st-ok); } .st-done { color: var(--st-done); }
.qc-pass { color: var(--qc-pass); } .qc-warn { color: var(--qc-warn); } .qc-fail { color: var(--qc-fail); }
.net { display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--border); color: var(--muted); background: var(--surface); }
.lang { font-size: 11px; font-weight: 650; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.lang.bn { font-family: "Hind Siliguri", var(--ui); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-ctl); padding: 2px; background: var(--surface-2); gap: 2px; }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 550; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* page headers & sections */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head .sub { color: var(--muted); margin-top: 4px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }
.panel { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.panel-head .n { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

/* inbox */
.irow { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); }
.irow:first-of-type { border-top: 0; }
.irow .title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.thumb { width: 44px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
.quote { font-size: 13px; color: var(--muted); border-left: 2px solid var(--border-strong); padding-left: 8px; margin-top: 3px; }
.progress-line { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty .big { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); }

.drop { border: 1.5px dashed var(--border-strong); border-radius: 10px; padding: 18px; display: grid; gap: 4px; justify-items: center; text-align: center; color: var(--muted); }
/* onboarding */
.checklist { list-style: none; margin: 0; padding: 2px 14px 8px; }
.checklist li { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--border); }
.checklist li:first-child { border-top: 0; }
.checklist .ck { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: grid; place-items: center; }
.checklist .ck svg.lucide { width: 13px; height: 13px; }
.checklist li.done .ck { background: var(--st-ok); border-color: var(--st-ok); color: var(--surface); }
.checklist .t { font-weight: 550; } .checklist li.done .t { color: var(--muted); text-decoration: line-through; }
.mail-layout { display: grid; grid-template-columns: 250px minmax(0,1fr); gap: 18px; }
.mail-list { display: grid; gap: 4px; align-content: start; }
.mail-list button { text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; gap: 2px; }
.mail-list button[aria-current="true"] { border-color: var(--border-strong); background: var(--surface-2); }
.mail { background: #F4F3F0; border-radius: 12px; padding: 18px; color: #1C1A17; min-width: 0; }
.mail .hdr { font-size: 12.5px; color: #5B5750; display: grid; gap: 2px; margin-bottom: 12px; overflow-wrap: anywhere; }
.mail .card { background: #FFFFFF; border: 1px solid #E4E2DD; border-radius: 12px; padding: 24px; max-width: 560px; margin: 0 auto; display: grid; gap: 14px; font-size: 14.5px; line-height: 1.6; }
.mail .cta { justify-self: start; background: #F5B301; color: #1C1A17; font-weight: 600; border-radius: 8px; padding: 10px 16px; border: 0; cursor: pointer; font-size: 14px; }
.mail .fine { font-size: 12px; color: #6F6A62; }
@media (max-width: 900px) { .mail-layout { grid-template-columns: minmax(0,1fr); } .mail-list { grid-auto-flow: column; grid-auto-columns: 210px; overflow-x: auto; } }

/* brands */
.grid-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.tile { border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px; display: grid; gap: 12px; background: var(--surface); cursor: pointer; text-align: left; }
.tile:hover { border-color: var(--border-strong); }
.mono { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff; flex: none; }
.tile .stats { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); }
.tile .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tile.new { border-style: dashed; place-items: center; color: var(--muted); min-height: 150px; }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

/* forms */
.field { display: grid; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 550; color: var(--muted); }
.input, .textarea, .select { width: 100%; border: 1px solid var(--input); border-radius: var(--r-ctl); background: var(--surface); padding: 7px 10px; min-width: 0; }
.textarea { min-height: 70px; resize: vertical; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
.kv { display: grid; grid-template-columns: 140px minmax(0,1fr); gap: 10px 16px; font-size: 13.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.swatch { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); display: inline-block; vertical-align: middle; }
.toggle { width: 34px; height: 20px; border-radius: 999px; background: var(--border-strong); position: relative; border: 0; cursor: pointer; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.toggle[aria-checked="true"] { background: var(--ink); }
.toggle[aria-checked="true"]::after { left: 17px; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
.cal .dow { font-size: 11.5px; font-weight: 600; color: var(--faint); padding: 6px 8px; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.cal .day { min-height: 104px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cal .day:nth-child(7n) { border-right: 0; }
.cal .day .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal .day.out .d { color: var(--faint); opacity: .6; }
.cal .day.today .d { color: var(--on-gold); background: var(--gold); border-radius: 4px; padding: 0 5px; align-self: flex-start; font-weight: 650; }
.idea { border: 1px solid var(--border); border-radius: 7px; padding: 5px 7px; font-size: 12px; background: var(--surface); cursor: pointer; text-align: left; display: grid; gap: 3px; min-width: 0; }
.idea:hover, .idea[aria-pressed="true"] { border-color: var(--ink); }
.idea .t { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.idea .m { display: flex; gap: 4px; align-items: center; color: var(--faint); font-size: 11px; }
.hol { border: 1px dashed var(--st-review); color: var(--st-review); border-radius: 7px; padding: 4px 7px; font-size: 11.5px; background: transparent; cursor: pointer; text-align: left; display: grid; gap: 1px; }
.hol b { font-weight: 600; }
.chip-cal { font-size: 11.5px; border-radius: 5px; padding: 2px 6px; color: var(--ink); background: var(--surface-2); border-left: 3px solid var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ideas layout */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; }
.side-panel { border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px; display: grid; gap: 12px; align-content: start; }
.genbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--border); border-radius: var(--r-card); padding: 10px 14px; margin-top: 14px; background: var(--surface-2); }

/* stepper */
.stepper { display: flex; gap: 0; align-items: center; flex-wrap: wrap; font-size: 12.5px; margin-bottom: 16px; row-gap: 6px; }
.stepper .s { display: inline-flex; gap: 6px; align-items: center; color: var(--faint); }
.stepper .s.done { color: var(--muted); } .stepper .s.now { color: var(--ink); font-weight: 650; }
.stepper .sep { width: 22px; height: 1px; background: var(--border-strong); margin: 0 8px; }
.stepper .s .n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; border: 1px solid currentColor; }
.stepper .s.now .n { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }

/* posts grid */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.pcard { border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; background: var(--surface); display: grid; position: relative; }
.pcard[aria-selected="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.pcard .art-wrap { padding: 10px 10px 0; cursor: pointer; background: none; border: 0; text-align: left; }
.pcard .body { padding: 10px; display: grid; gap: 8px; }
.pcard .t { font-weight: 550; font-size: 13.5px; line-height: 1.35; }
.pcard .sel { position: absolute; top: 16px; left: 16px; width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid #fff; background: rgba(0,0,0,.35); cursor: pointer; display: grid; place-items: center; color: #fff; }
.pcard[aria-selected="true"] .sel { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.selbar { position: sticky; bottom: 12px; margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; background: var(--ink); color: var(--surface); border-radius: var(--r-card); padding: 8px 10px 8px 14px; box-shadow: var(--shadow); }
.selbar .btn { background: transparent; color: var(--surface); border-color: rgba(255,255,255,.25); }
.selbar .btn-gold { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.shimmer { position: relative; overflow: hidden; }
.shimmer::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); animation: sh 1.6s infinite; }
@keyframes sh { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

function calCells() {
  const out = [{ n: 30, out: true, today: false }];
  for (let d = 1; d <= 31; d++) out.push({ n: d });
  for (let d = 1; d <= 3; d++) out.push({ n: d, out: true });
  out[0].today = true; return out;
}

    body: "<p>Hi Nadia,</p><p>You started setting up on Friday. Your 5 sample posts are ready whenever you are; reviewing them takes about three minutes.</p>", cta: "Pick up where you left off", fine: "We'll send at most one more reminder. Stop these reminders." },
  { k: "Team invite", who: "Invited member · when someone invites them", from: "Nadia Karim via LetZeusPost <hello@letzeuspost.com>", to: "tanvir@northwind.social", subj: "Nadia invited you to Northwind Social",
    body: "<p>Nadia Karim invited you to join <b>Northwind Social</b> on LetZeusPost as an <b>Editor</b>. Editors make posts, approve them for the agency and export them.</p>", cta: "Accept the invite", fine: "The invite works once and expires on 13 November." },
  { k: "Client: first review", who: "The client · the first time posts are sent to them", from: "Northwind Social via LetZeusPost <reviews@letzeuspost.com>", to: "rafiq@golpocafe.com.bd", subj: "12 posts for Golpo Café are ready for your review", agency: true,
    body: "<p>Hi Rafiq,</p><p>Nadia from Northwind Social has sent you 12 posts for December. You don't need an account: open the link, look at each post, then approve it or say what to change. It works on your phone.</p>", cta: "Review the posts", fine: "This link is only for you and expires in 30 days." },
  { k: "Client reminder", who: "The client · once, 2 days later, if posts are still waiting", from: "Northwind Social via LetZeusPost <reviews@letzeuspost.com>", to: "rafiq@golpocafe.com.bd", subj: "4 posts for Golpo Café still need your OK", agency: true,
    body: "<p>Hi Rafiq,</p><p>4 of the 12 posts are still waiting for you. The first one goes out on Saturday 5 December.</p>", cta: "Review the posts", fine: "Sent once. Northwind Social can turn reminders off." },
];
V.emails = () => {
  const m = EMAILS[S.mail];
  const brand = m.agency ? `<div class="row" style="gap:8px"><span class="avatar" style="background:#23395B;color:#fff;border:0">NS</span><b>Northwind Social</b></div>` : `<div class="row" style="gap:8px">${markSvg("lzp", 24)}<b style="font-weight:500">Let<span style="font-weight:700">Zeus</span>Post</b></div>`;
  return `<div class="page-head"><div><h1>Onboarding emails</h1><p class="sub">What people get by email while they start: short, plain, and only when it helps.</p></div></div>
  <div class="mail-layout"><nav class="mail-list" aria-label="Emails">${EMAILS.map((e, i) => `<button data-act="mail" data-v="${i}" aria-current="${S.mail === i}"><b style="font-weight:600">${e.k}</b><span class="faint" style="font-size:12px">${e.who}</span></button>`).join("")}</nav>
  <div class="mail"><div class="hdr"><span><b>From</b> ${esc(m.from)}</span><span><b>To</b> ${m.to}</span><span><b>Subject</b> ${m.subj}</span></div>
  <div class="card">${brand}${typeof m.body === "function" ? m.body() : m.body}<button class="cta" data-act="toast" data-msg="Mockup: the button opens LetZeusPost">${m.cta}</button>${m.fine ? `<p class="fine">${m.fine}</p>` : ""}<p class="fine">LetZeusPost${m.agency ? " · sent for Northwind Social" : ""}</p></div></div></div>`;
};
function openInvite() {
  $("#layer").innerHTML = `<div class="scrim" data-act="close-layer"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="inv-h" data-stop>
    <header><h2 id="inv-h">Invite your team</h2><button class="icon-btn" data-act="close-layer" aria-label="Close">${ic("x")}</button></header>
    <div class="content"><div class="field"><label for="inv-email">Email</label><input id="inv-email" class="input" value="tanvir@northwind.social"></div>
      <div class="field"><label for="inv-role">Role</label><select id="inv-role" class="select"><option>Editor: makes posts, approves for the agency, exports</option><option>Viewer: looks and comments only</option><option>Admin: brands, members and settings</option></select></div>
      <p class="faint" style="font-size:12.5px">3 of 5 seats used; Viewers are free. The invite works once and expires in 7 days.</p></div>
    <footer><button class="btn" data-act="close-layer">Cancel</button><button class="btn btn-gold" data-act="sendinvite">${ic("send")}Send invite</button></footer></div></div>`;
  icons(); $("#inv-email").focus();
}

/* ---------- export dialog & create menu ---------- */
function openExport() {
  const n = POSTS.filter(p => S.sel.has(p.id)).length || 1;
  $("#layer").innerHTML = `<div class="scrim" data-act="close-layer"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ex-h" data-stop>
    <header><h2 id="ex-h">Export ${n} post${n > 1 ? "s" : ""}</h2><button class="icon-btn" data-act="close-layer" aria-label="Close">${ic("x")}</button></header>
    <div class="content">
      <fieldset style="border:0;padding:0;margin:0;display:grid;gap:8px"><legend class="eyebrow" style="margin-bottom:6px">What</legend>
        <label class="opt"><input type="radio" name="ex-scope" id="ex-sel" checked><span>Selected posts<small>${n} post${n > 1 ? "s" : ""}, all sizes and both languages</small></span></label>
        <label class="opt"><input type="radio" name="ex-scope" id="ex-approved"><span>Every approved post in this batch<small>4 posts</small></span></label></fieldset>
      <fieldset style="border:0;padding:0;margin:0;display:grid;gap:8px"><legend class="eyebrow" style="margin-bottom:6px">Formats</legend>
        <label class="opt"><input type="checkbox" id="ex-zip" checked><span>ZIP of images<small>PNG per size and slide, a captions file per network, alt text</small></span></label>
        <label class="opt"><input type="checkbox" id="ex-pdf"><span>LinkedIn carousel PDF<small>One PDF per carousel</small></span></label>
        <label class="opt"><input type="checkbox" id="ex-csv" checked><span>Metricool CSV<small>One row per network, times in Asia/Dhaka. Image links stay online until a week after the last post date.</small></span></label>
        <label class="opt" style="margin-left:28px"><input type="checkbox" id="ex-draft" checked><span>Arrive in Metricool as drafts<small>Check them there before they publish</small></span></label></fieldset>
      <div><span class="eyebrow">Earlier exports</span><div class="faint" style="font-size:13px;margin-top:6px">27 Nov · 6 posts · ZIP + Metricool CSV · Nadia</div></div>
    </div>
    <footer><button class="btn" data-act="close-layer">Cancel</button><button class="btn btn-gold" data-act="download">${ic("download")}Download</button></footer></div></div>`;
  icons(); $("#ex-sel").focus();
}
function openCreate(btn) {
  const r = btn.getBoundingClientRect();
  $("#layer").innerHTML = `<div style="position:fixed;inset:0;z-index:14" data-act="close-layer"></div><div class="menu" role="menu" style="top:${r.bottom + 6}px;left:${Math.max(16, Math.min(r.left, innerWidth - 260))}px;position:fixed">
    <button role="menuitem" data-go="ideas">${ic("calendar-plus")}New calendar<small>Plan a week or a month for one brand</small></button>
    <button role="menuitem" data-go="editor">${ic("pen-line")}One-off post<small>From a short brief</small></button>
    <button role="menuitem" data-go="ideas">${ic("link")}From a link<small>A blog post, product page or video</small></button></div>`;
  icons(); btn.setAttribute("aria-expanded", "true"); $(".menu button").focus();
}
function closeLayer() { $("#layer").innerHTML = ""; const c = $("#create-btn"); c && c.setAttribute("aria-expanded", "false"); const w = $("#ws-btn"); w && w.setAttribute("aria-expanded", "false"); }

/* ---------- router & render ---------- */
const ROUTES = [["welcome", "Welcome (first run)"], ["invite", "Team member joining"], ["inbox", "Inbox"], ["calendar", "Calendar"], ["brands", "Brands"], ["brand-new", "New brand"], ["kit", "Brand kit"], ["ideas", "Batch: ideas"], ["posts", "Batch: posts"], ["editor", "Post editor"], ["export", "Export dialog"], ["review", "Client review (phone)"], ["plan-usage", "Settings: plan & usage"], ["members", "Settings: members and seats"], ["admin", "Zeus's admin panel"], ["emails", "Onboarding emails"], ["site", "Public page (letzeuspost.com)"], ["logos", "Logos (sample)"]];
$("#screen-pick").innerHTML = ROUTES.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
document.querySelectorAll("[data-mark]").forEach(el => { el.innerHTML = markSvg(el.dataset.mark, +el.dataset.size || 18); });
function icons() {
  try { if (!window.lucide) return; const o = { attrs: { "aria-hidden": "true" } }; if (lucide.icons) o.icons = lucide.icons; lucide.createIcons(o); } catch (e) {}
}
function navKey(r) {
  if (r === "posts" || r === "export") return S.postsBrand === "golpo" ? "brand:golpo" : "brand:" + S.postsBrand;
  if (["kit", "ideas", "editor"].includes(r)) return "brand:golpo";
  if (r === "brand-new") return "brands";
  if (r === "members") return "plan-usage";
  return r;
}
function render() {
  const r = S.route === "export" ? "posts" : S.route;
  document.body.classList.toggle("route-review", r === "review");
  document.body.classList.toggle("route-welcome", r === "welcome" || r === "invite" || r === "site");
  $("#view").innerHTML = (V[r] || V.inbox)();
  const cur = navKey(S.route);
  document.querySelectorAll(".side .nav").forEach(n => {
    const k = n.dataset.brand ? "brand:" + n.dataset.brand : n.dataset.go === "kit" ? "brand:golpo" : n.dataset.go;
    if (k === cur) n.setAttribute("aria-current", "page"); else n.removeAttribute("aria-current");
  });
  $("#screen-pick").value = S.route;
  icons();
  if (S.route === "export") openExport();
}
function go(route, brand) {
  if (route === "posts" || route === "export") S.postsBrand = brand || "golpo";
  closeLayer(); S.route = route;
  try { if (location.hash.slice(1) !== route) history.replaceState(null, "", "#" + route); } catch (e) {}
  render(); $("#view").focus({ preventScroll: true }); scrollTo({ top: 0 });
}
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (ROUTES.some(r => r[0] === h)) { S.route = h; closeLayer(); render(); } });
$("#screen-pick").addEventListener("change", e => go(e.target.value, e.target.value === "posts" ? "golpo" : undefined));

/* theme */
function setTheme(t) {
  if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeSet === t));
  try { localStorage.setItem("lzp-mock-theme", t); } catch (e) {}
}
try { const t = localStorage.getItem("lzp-mock-theme"); if (t) setTheme(t); } catch (e) {}

/* events */
document.addEventListener("click", e => {
  const th = e.target.closest("[data-theme-set]"); if (th) return setTheme(th.dataset.themeSet);
  if (e.target.closest("#create-btn")) return openCreate($("#create-btn"));
  if (e.target.closest("#ws-btn")) return openWs($("#ws-btn"));
  if (e.target.closest("#kit-create")) return go("ideas");
  const el = e.target.closest("[data-go],[data-act]"); if (!el) return;
  if (el.dataset.act === "close-layer" && e.target.closest("[data-stop]") && !e.target.closest("button[data-act='close-layer']")) return;
  if (el.dataset.go) { if (el.dataset.kit) S.kitTab = el.dataset.kit; return go(el.dataset.go, el.dataset.brand); }
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case "hidecheck": S.checklistHidden = true; render(); toast("Checklist hidden. Bring it back from the help menu."); break;
    case "invitedlg": openInvite(); break;
    case "sendinvite": closeLayer(); toast("Invite sent to tanvir@northwind.social. Pick “Team member joining” in the screen list to see what Tanvir sees."); break;
    case "ivnext": S.inviteStep = 2; render(); break;
    case "ivback": S.inviteStep = 1; render(); break;
    case "mail": S.mail = +v; render(); break;
    case "nb": S.nb = v; render(); break;
    case "toast": toast(el.dataset.msg); break;
    case "cur": S.cur = v; render(); break;
    case "filter": S.filter = v; render(); break;
    case "empty": S.inboxEmpty = !S.inboxEmpty; render(); break;
    case "look": S.look = v; render(); break;
    case "kittab": S.kitTab = v; render(); break;
    case "switch": el.setAttribute("aria-checked", el.getAttribute("aria-checked") !== "true"); break;
    case "press": el.setAttribute("aria-pressed", el.getAttribute("aria-pressed") !== "true"); break;
    case "idea": S.idea = +v; render(); break;
    case "addhol": S.extraIdeas.push({ d: +v, t: HOLIDAYS[v][0] + " post", type: "Image", lang: "EN + BN", time: "12:30", pillar: "Holiday" }); S.idea = +v; render(); toast("Idea added for " + HOLIDAYS[v][0]); break;
    case "pview": S.postsView = v; render(); break;
    case "sel": S.sel.has(v) ? S.sel.delete(v) : S.sel.add(v); render(); break;
    case "clearsel": S.sel.clear(); render(); break;
    case "export": openExport(); break;
    case "close-layer": closeLayer(); if (S.route === "export") go("posts"); break;
    case "download": closeLayer(); toast("Mockup: nothing downloads. The real export makes a ZIP and a CSV."); break;
    case "lang": S.lang = v; render(); break;
    case "slide": S.slide = +v; render(); break;
    case "size": S.size = v; render(); break;
    case "safe": S.safe = !S.safe; if (S.safe) S.size = "story"; render(); break;
    case "tab": S.tab = v; render(); break;
    case "img": S.img = v; render(); break;
    case "wnext": S.wstep = Math.min(4, S.wstep + 1); render(); break;
    case "wback": S.wstep = Math.max(1, S.wstep - 1); render(); break;
    case "rvok": S.rv[v] = "ok"; render(); break;
    case "rvcr": S.rvCr = v; render(); const t = document.getElementById("cr-" + v); t && t.focus(); break;
    case "rvall": ["pitha", "quiz", "victory"].forEach(id => { if (!S.rv[id]) S.rv[id] = "ok"; }); render(); toast("Approved all remaining posts"); break;
  }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  if (f.dataset.form === "rewrite") { const q = $("#rewrite-in").value.trim() || "warmer"; toast(`Rewriting slide ${S.slide + 1}: “${q}”…`); }
  if (f.dataset.form === "hello") { S.rvName = $("#rv-name").value || "Rafiq"; render(); }
  if (f.dataset.form === "cr") { S.rv[f.dataset.v] = "cr"; S.rvCr = null; render(); toast("Sent to Nadia"); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#layer").innerHTML) { closeLayer(); if (S.route === "export") go("posts"); }
  if (S.route === "editor" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    if (e.key === "ArrowRight") { S.slide = Math.min(3, S.slide + 1); render(); }
    if (e.key === "ArrowLeft") { S.slide = Math.max(0, S.slide - 1); render(); }
  }
});

const start = location.hash.slice(1);
S.route = ROUTES.some(r => r[0] === start) ? start : "inbox";
render();
})();
</script>
