# Advisories Zeus accepted, for CI's OSV-Scanner (§20). Each entry says who decided, when and why, and stops counting
# on its `ignoreUntil` date, when it is looked at again. An ignore matches the advisory id anywhere in the lockfile, so
# scripts/accepted-advisories.test.ts keeps each one to the path it was accepted on. Builders can't edit this file; a
# change is sensitive.

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-12-08T00:00:00Z
reason = "deepmerge 4.3.1 (prototype poisoning in mergeObject; no fixed version), only through shadcn@4.23.0 and @shadcn/registry: the dev-only CLI in packages/ui, which only Athena runs to add components. It merges registry JSON fetched from ui.shadcn.com, which isn't trusted input, on a Mac that holds GitHub credentials; so Athena runs it only in a scratch clone with no .env file and no credentials, with HOME at an empty temp folder (the shadcn skill's rule), and the files it writes are reviewed in the PR. Accepted by Zeus, 2026-11-08 (#107); looked at again on 2026-12-08."

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-08T00:00:00Z
reason = "picomatch 2.3.2 and 4.0.7 (ReDoS on repeated extglob patterns such as `+(*)`, which can block the Node.js event loop; CVSS 8.7, availability only; no patched version, published 2026-10-19), only through dev tooling: @next/eslint-plugin-next and typescript-eslint (root devDependencies), and shadcn, Storybook and Vite (packages/ui devDependencies). No production dependency reaches it: scripts/accepted-advisories.test.ts fails if one ever does. It only hurts if someone controls the glob picomatch matches; every glob here comes from the repo's own config files, which are sensitive paths reviewed in every PR, so the worst case is a stuck lint, build or test run, never data. Accepted by Zeus, 2026-11-17 (#259; his decision is Athena's dated comment https://github.com/picasso-canvas/letzeuspost/issues/259#issuecomment-6954441893); looked at again on 2026-12-08, or sooner if a patched version appears."
