packages:
  - apps/*
  - packages/*
  - config

engineStrict: true
# Fail the install when a dependency wants to run a build script that isn't allowed.
strictDepBuilds: true
# Only install versions published at least a day ago (minutes).
minimumReleaseAge: 1440

# Security overrides: each names the advisory it fixes. Remove when the parent package updates.
overrides:
  # GHSA-g3hv-75wg-m249 (medium, DoS via globparts amplification), via eslint → @eslint/config-array.
  minimatch@>=7.0.0 <11.0.1: 11.0.5
  # vitest and drizzle-kit are optional peers of better-auth: keep dev tools out of the production dependency graph.
  better-auth>vitest: '-'
  better-auth>drizzle-kit: '-'
  # GHSA-67mh-4wv8-2f99 (medium, the dev server answers any website), via drizzle-kit → @esbuild-kit/core-utils
  # (dev only; it uses esbuild's transform API, unchanged in 0.25).
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # GHSA-3g3m-2fjr-6pw4 (medium, AbortSignal bypass), via @storybook/react-vite → its docgen plugin (dev only).
  '@joshwooding/vite-plugin-react-docgen-typescript>glob': 14.0.2
  # GHSA-gcqx-w48m-w2h4 (low, no fixed deepmerge): @react-email/components' own render 2.0.6 pulls an older
  # html-to-text → deepmerge 4.3.1; use the render 2.2.0 packages/email already depends on.
  '@react-email/components>@react-email/render': 2.2.0
  # GHSA-mrhx-c7xc-m3w5 (high, memory exhaustion on oversized collections; fixed only in zod 4), via the dev-only
  # @google/design.md (^3.24). Its lint, export and diff give byte-identical output on the repo's zod 4.6.7 (#70).
  '@google/design.md>zod': 4.6.7

# Build scripts, each by name (strictDepBuilds fails any other). esbuild's postinstall only fetches a binary the
# package already ships as an optional dependency, so it stays off.
allowBuilds:
  esbuild: false
